<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="How it fits together: Tesla HW1 car, harness, comma device running sunnypilot, optional Chestnut, sunnylink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1222"/>
      <stop offset="1" stop-color="#1b1638"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8a93a8"/>
    </marker>
  </defs>
  <rect width="1280" height="330" rx="18" fill="url(#bg)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#ffb347" font-size="15" font-weight="700" letter-spacing="3">HOW IT FITS TOGETHER</text>

    <!-- car -->
    <rect x="40" y="86" width="250" height="190" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#c4643a" stroke-opacity="0.8"/>
    <text x="64" y="124" fill="#ffffff" font-size="22" font-weight="700">Tesla S / X</text>
    <text x="64" y="150" fill="#cfd6e4" font-size="15">Autopilot HW1 (Mobileye)</text>
    <text x="64" y="186" fill="#9aa3b5" font-size="14">• steering (EPAS)</text>
    <text x="64" y="208" fill="#9aa3b5" font-size="14">• cruise / speed / brakes</text>
    <text x="64" y="230" fill="#9aa3b5" font-size="14">• doors, belts, gear</text>
    <text x="64" y="252" fill="#9aa3b5" font-size="14">• Bosch radar (bus 1)</text>

    <path d="M296 181 L350 181" stroke="#8a93a8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="323" y="170" fill="#8a93a8" font-size="12" text-anchor="middle">CAN</text>

    <!-- harness -->
    <rect x="356" y="126" width="150" height="110" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#8a93a8" stroke-opacity="0.7"/>
    <text x="431" y="170" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">Harness</text>
    <text x="431" y="194" fill="#9aa3b5" font-size="14" text-anchor="middle">xnor HW1</text>

    <path d="M512 181 L566 181" stroke="#8a93a8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- comma -->
    <rect x="572" y="76" width="330" height="210" rx="14" fill="#3cf0a8" fill-opacity="0.07" stroke="#3cf0a8" stroke-opacity="0.8"/>
    <text x="596" y="114" fill="#ffffff" font-size="22" font-weight="700">comma 4 / 3X</text>
    <text x="596" y="140" fill="#b9f8de" font-size="15">sunnypilot · this fork</text>
    <text x="596" y="176" fill="#9aa3b5" font-size="14">• Nov 2026 driving models (selector v25)</text>
    <text x="596" y="198" fill="#9aa3b5" font-size="14">• teslaLegacy panda safety (HW1)</text>
    <text x="596" y="220" fill="#9aa3b5" font-size="14">• PitStop local web UI (car off)</text>
    <text x="596" y="242" fill="#9aa3b5" font-size="14">• op fork · prebuilt branch</text>
    <text x="596" y="264" fill="#9aa3b5" font-size="14">• driver monitoring unchanged</text>

    <!-- chestnut -->
    <path d="M908 130 L962 130" stroke="#8a93a8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="935" y="119" fill="#8a93a8" font-size="12" text-anchor="middle">USB</text>
    <rect x="968" y="80" width="272" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffb347" stroke-opacity="0.7" stroke-dasharray="6 5"/>
    <text x="992" y="116" fill="#ffffff" font-size="18" font-weight="700">Chestnut (optional)</text>
    <text x="992" y="142" fill="#9aa3b5" font-size="14">external GPU → big models,</text>
    <text x="992" y="162" fill="#9aa3b5" font-size="14">falls back to normal models</text>

    <!-- sunnylink -->
    <path d="M908 236 L962 236" stroke="#8a93a8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="935" y="225" fill="#8a93a8" font-size="12" text-anchor="middle">Wi-Fi</text>
    <rect x="968" y="190" width="272" height="96" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffb347" stroke-opacity="0.7"/>
    <text x="992" y="226" fill="#ffffff" font-size="18" font-weight="700">sunnylink app</text>
    <text x="992" y="252" fill="#9aa3b5" font-size="14">switch models, settings,</text>
    <text x="992" y="272" fill="#9aa3b5" font-size="14">backup / restore</text>
  </g>
</svg>
