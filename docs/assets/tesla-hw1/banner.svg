<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="sunnypilot for Tesla Model S and Model X with Autopilot HW1">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.55" stop-color="#1b1638"/>
      <stop offset="0.80" stop-color="#5a2a3a"/>
      <stop offset="1" stop-color="#c4643a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15131f"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="0.45" stop-color="#b9c1cc"/>
      <stop offset="1" stop-color="#5d6672"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a66"/>
      <stop offset="0.6" stop-color="#151b2b"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cf0a8" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#3cf0a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3cf0a8" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7dce3"/>
      <stop offset="0.7" stop-color="#8b939e"/>
      <stop offset="1" stop-color="#4a515b"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky and sunset -->
  <rect width="1280" height="420" fill="url(#sky)"/>
  <circle cx="930" cy="292" r="190" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="40" r="1.2"/><circle cx="260" cy="88" r="1"/><circle cx="410" cy="30" r="1.4"/>
    <circle cx="560" cy="70" r="1"/><circle cx="700" cy="36" r="1.2"/><circle cx="1180" cy="52" r="1.3"/>
    <circle cx="1060" cy="24" r="1"/><circle cx="1240" cy="120" r="1"/><circle cx="330" cy="140" r="0.9"/>
  </g>

  <!-- road -->
  <rect y="322" width="1280" height="98" fill="url(#road)"/>
  <rect y="322" width="1280" height="2" fill="#ff9a52" opacity="0.35"/>
  <g fill="#f4f1e8" opacity="0.35">
    <rect x="20" y="392" width="70" height="5" rx="2"/><rect x="170" y="392" width="70" height="5" rx="2"/>
    <rect x="320" y="392" width="70" height="5" rx="2"/><rect x="470" y="392" width="70" height="5" rx="2"/>
    <rect x="620" y="392" width="70" height="5" rx="2"/><rect x="770" y="392" width="70" height="5" rx="2"/>
    <rect x="920" y="392" width="70" height="5" rx="2"/><rect x="1070" y="392" width="70" height="5" rx="2"/>
    <rect x="1220" y="392" width="70" height="5" rx="2"/>
  </g>
  <!-- the driving path openpilot draws ahead of the car -->
  <polygon points="1120,358 1280,346 1280,372 1120,372" fill="url(#path)"/>
  <rect x="600" y="358" width="680" height="3" fill="url(#path)"/>

  <!-- car: original side-view drawing of a long liftback sedan -->
  <ellipse cx="895" cy="358" rx="290" ry="10" fill="#000" opacity="0.55" filter="url(#soft)"/>
  <g>
    <path fill="url(#body)" d="M640 346 L633 322 Q630 300 642 290 L668 279 Q700 262 760 246 Q830 218 880 214 Q930 212 975 230 L1030 258 Q1100 268 1140 282 Q1162 290 1164 312 L1160 340 L1108 346 A52 52 0 0 0 1006 346 L784 346 A52 52 0 0 0 682 346 Z"/>
    <!-- greenhouse -->
    <path fill="url(#glass)" d="M700 280 Q760 252 830 230 Q880 222 925 224 Q962 228 1002 256 L1004 262 L702 286 Z"/>
    <path d="M884 224 L878 272" stroke="#0a0d15" stroke-width="7"/>
    <path d="M700 280 Q760 252 830 230 Q880 222 925 224 Q962 228 1002 256" fill="none" stroke="#2a3346" stroke-width="2"/>
    <!-- body lines and details -->
    <path d="M676 300 Q850 286 1140 296" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M700 322 L1000 322" stroke="#3b424d" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M1118 282 Q1140 284 1154 296 L1126 296 Q1114 292 1118 282 Z" fill="#fff6e0"/>
    <path d="M1150 290 L1280 270 L1280 330 Z" fill="#fff4d6" opacity="0.08"/>
    <path d="M636 296 L656 290 L660 300 L638 306 Z" fill="#ff3b3b"/>
    <rect x="828" y="300" width="20" height="4" rx="2" fill="#e8ecf1"/>
    <rect x="955" y="298" width="20" height="4" rx="2" fill="#e8ecf1"/>
    <!-- comma device behind the windshield -->
    <rect x="965" y="236" width="12" height="8" rx="2" fill="#3cf0a8" opacity="0.9"/>
  </g>
  <!-- wheels -->
  <g>
    <circle cx="733" cy="346" r="44" fill="#0c0d10"/>
    <circle cx="733" cy="346" r="29" fill="url(#rim)"/>
    <g stroke="#3c434c" stroke-width="5" stroke-linecap="round">
      <path d="M733 322 L733 370"/><path d="M709 346 L757 346"/><path d="M716 329 L750 363"/><path d="M750 329 L716 363"/>
    </g>
    <circle cx="733" cy="346" r="7" fill="#2a2f36"/>
    <circle cx="1057" cy="346" r="44" fill="#0c0d10"/>
    <circle cx="1057" cy="346" r="29" fill="url(#rim)"/>
    <g stroke="#3c434c" stroke-width="5" stroke-linecap="round">
      <path d="M1057 322 L1057 370"/><path d="M1033 346 L1081 346"/><path d="M1040 329 L1074 363"/><path d="M1074 329 L1040 363"/>
    </g>
    <circle cx="1057" cy="346" r="7" fill="#2a2f36"/>
  </g>

  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#ffb347" font-size="15" font-weight="700" letter-spacing="3">SUNNYPILOT · NOVEMBER 2026</text>
    <text x="64" y="146" fill="#ffffff" font-size="54" font-weight="800">Tesla Model S &amp; X</text>
    <text x="64" y="190" fill="#cfd6e4" font-size="28" font-weight="400">Autopilot HW1 · 2014–2016</text>
    <g font-size="15" font-weight="600">
      <rect x="64" y="222" width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffb347" stroke-opacity="0.6"/>
      <text x="169" y="244" fill="#ffe2b8" text-anchor="middle">Nov 2026 driving models</text>
      <rect x="286" y="222" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffb347" stroke-opacity="0.6"/>
      <text x="344" y="244" fill="#ffe2b8" text-anchor="middle">sunnylink</text>
      <rect x="64" y="266" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#3cf0a8" stroke-opacity="0.6"/>
      <text x="152" y="288" fill="#b9f8de" text-anchor="middle">Chestnut big models</text>
      <rect x="252" y="266" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#3cf0a8" stroke-opacity="0.6"/>
      <text x="337" y="288" fill="#b9f8de" text-anchor="middle">comma 3X · comma 4</text>
    </g>
  </g>
</svg>
